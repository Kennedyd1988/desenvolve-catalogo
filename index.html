<style>
:root{
  --bg:#FAFAFA;--surface:#fff;--fg:#222;--fg2:#777;
  --green:#4CAF50;--blue:#1565C0;--gold:#F9A825;--red:#E53935;--pink:#EC407A;
  --accent:var(--blue);--accent2:var(--green);--accent3:var(--gold);--accent4:var(--red);--accent5:var(--pink);
  --border:#E8E8E8;--radius:14px;
  --font:'Nunito',system-ui,sans-serif;--mono:'Space Mono',monospace;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111;--surface:#1C1C1E;--fg:#F0F0F0;--fg2:#999;
  --border:#2E2E2E;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111;--surface:#1C1C1E;--fg:#F0F0F0;--fg2:#999;
  --border:#2E2E2E;color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--font);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;line-height:1.5;-webkit-font-smoothing:antialiased;}
*{box-sizing:border-box;margin:0;padding:0;}
.app{max-width:640px;margin:0 auto;padding-bottom:100px;}

/* Brand header */
.brand-header{text-align:center;padding:16px 0 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:2px solid var(--border);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);}
.brand-logo{height:48px;object-fit:contain;}
.brand-sub{font-size:11px;color:var(--fg2);letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-top:2px;}

/* Color bar */
.color-bar{display:flex;height:4px;border-radius:2px;overflow:hidden;margin-top:8px;}
.color-bar span{flex:1;}
.cb-green{background:var(--green);} .cb-blue{background:var(--blue);} .cb-gold{background:var(--gold);} .cb-red{background:var(--red);} .cb-pink{background:var(--pink);}

/* Stats */
.stats-row{display:flex;gap:8px;margin-top:12px;overflow-x:auto;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;flex:1;min-width:0;text-align:center;transition:transform .2s;}
.stat:hover{transform:translateY(-2px);}
.stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg2);font-weight:700;}
.stat-value{font-family:var(--mono);font-size:20px;font-weight:800;}

/* Toolbar */
.toolbar{display:flex;gap:8px;margin-top:12px;}
.search-box{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;font-size:14px;font-family:var(--font);color:var(--fg);outline:none;transition:border-color .2s;}
.search-box:focus{border-color:var(--accent);}
.search-box::placeholder{color:var(--fg2);}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:var(--radius);font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;padding:10px 16px;white-space:nowrap;transition:transform .15s,opacity .15s;}
.btn:active{transform:scale(.96);opacity:.8;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-green{background:var(--green);color:#fff;}
.btn-red{background:var(--red);color:#fff;}
.btn-gold{background:var(--gold);color:#fff;}
.btn-pink{background:var(--pink);color:#fff;}
.btn-outline{background:var(--surface);color:var(--fg);border:1px solid var(--border);}
.btn-sm{padding:6px 12px;font-size:13px;}

/* Tabs */
.tabs{display:flex;gap:0;margin-top:12px;border-bottom:2px solid var(--border);}
.tab{padding:8px 16px;font-size:13px;font-weight:700;color:var(--fg2);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;background:none;border-top:none;border-left:none;border-right:none;font-family:var(--font);transition:color .2s;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}

/* Product list */
.product-list{margin-top:12px;display:flex;flex-direction:column;gap:10px;}
.product-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;display:flex;gap:12px;align-items:center;transition:transform .2s,box-shadow .2s;}
.product-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.08);}
.product-thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--bg);flex-shrink:0;border:1px solid var(--border);}
.product-thumb-placeholder{width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,var(--green),var(--blue));flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;}
.product-info{flex:1;min-width:0;}
.product-name{font-weight:700;font-size:15px;}
.product-cat{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg2);margin-top:1px;}
.product-price{font-size:14px;color:var(--accent);font-family:var(--mono);font-weight:700;margin-top:2px;}
.product-stock{font-family:var(--mono);font-size:13px;font-weight:800;white-space:nowrap;padding:4px 10px;border-radius:8px;flex-shrink:0;}
.stock-ok{background:rgba(76,175,80,.12);color:var(--green);}
.stock-low{background:rgba(249,168,37,.12);color:var(--gold);}
.stock-out{background:rgba(229,57,53,.12);color:var(--red);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
.modal{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:85vh;overflow-y:auto;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));animation:slideUp .3s cubic-bezier(.16,1,.3,1);}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h2{font-size:18px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
.modal-close{background:none;border:none;font-size:24px;color:var(--fg2);cursor:pointer;padding:4px;line-height:1;}
.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--fg2);margin-bottom:5px;}
.form-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:15px;font-family:var(--font);color:var(--fg);outline:none;transition:border-color .2s;}
.form-input:focus{border-color:var(--accent);}
.form-row{display:flex;gap:10px;}.form-row>*{flex:1;min-width:0;}

/* Photo upload */
.photo-upload-area{border:2px dashed var(--border);border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;position:relative;overflow:hidden;}
.photo-upload-area:hover{border-color:var(--accent);background:rgba(21,101,192,.04);}
.photo-upload-area input[type="file"]{display:none;}
.photo-upload-area img{max-width:100%;max-height:160px;border-radius:10px;object-fit:contain;}
.photo-upload-label{font-size:13px;color:var(--fg2);}
.photo-upload-icon{font-size:28px;margin-bottom:4px;}

.movement-btns{display:flex;gap:8px;margin-top:8px;}

/* History */
.history-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;}
.history-item:last-child{border-bottom:none;}
.history-badge{font-family:var(--mono);font-size:13px;font-weight:800;padding:3px 8px;border-radius:8px;flex-shrink:0;}
.badge-in{background:rgba(76,175,80,.12);color:var(--green);}
.badge-out{background:rgba(229,57,53,.12);color:var(--red);}
.history-info{flex:1;min-width:0;}
.history-product{font-weight:700;}
.history-date{font-size:12px;color:var(--fg2);font-family:var(--mono);}
.history-note{font-size:12px;color:var(--fg2);margin-top:2px;}

/* Empty & misc */
.empty{text-align:center;padding:40px 20px;color:var(--fg2);}
.empty-icon{font-size:40px;margin-bottom:8px;}
.empty-text{font-size:14px;}
.delete-btn{background:none;border:none;color:var(--red);font-size:13px;font-family:var(--font);font-weight:700;cursor:pointer;padding:6px 0;margin-top:8px;}
.pdf-generating{opacity:.5;pointer-events:none;}

/* Order section in modal */
.order-section{background:var(--bg);border-radius:12px;padding:14px;margin-top:14px;}
.order-section h3{font-size:14px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.order-qty-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.order-qty-btn{width:36px;height:36px;border-radius:50%;border:2px solid var(--border);background:var(--surface);font-size:18px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;}
.order-qty-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
.order-qty-val{font-family:var(--mono);font-size:20px;font-weight:800;min-width:40px;text-align:center;}
.order-total{font-size:13px;color:var(--fg2);font-family:var(--mono);}
.whatsapp-btn{background:#25D366;color:#fff;width:100%;margin-top:10px;font-size:15px;border-radius:12px;padding:12px;}
.whatsapp-btn:hover{background:#1DA851;}

/* Order config in settings */
.settings-section{margin-top:14px;padding:14px;background:var(--bg);border-radius:12px;border:1px solid var(--border);}
.settings-section h3{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:8px;}

/* Botão fixo de instalação: canto superior direito, fora do caminho da busca
   e dos botões; fica abaixo das janelas (z-index 50) para não cobri-las */
.btn-instalar{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:20;
  background:var(--accent);color:#fff;border:none;border-radius:20px;padding:8px 14px;font-size:12px;
  font-weight:800;font-family:var(--font);cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.15);}
.btn-instalar:focus{outline:2px solid var(--accent);outline-offset:2px;}
/* Janela de instruções (iPhone e navegadores sem instalação automática) */
.modal-instalar{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:200;padding:16px;}
.modal-instalar .caixa{background:var(--surface);color:var(--fg);border:1px solid var(--border);border-radius:16px;padding:20px;width:100%;max-width:420px;margin-bottom:env(safe-area-inset-bottom,0px);}
.modal-instalar h3{font-size:18px;font-weight:800;margin-bottom:10px;}
.modal-instalar ol{padding-left:20px;font-size:14px;line-height:1.7;color:var(--fg2);margin-bottom:16px;}
@media(prefers-reduced-motion:reduce){.modal{animation:none;}}
</style>

try{ whatsappNumber=localStorage.getItem('cat_whatsapp')||''; storeName=localStorage.getItem('cat_storename')||'Desenvolve'; }catch(e){}

async function init(){
  try{db=await window.claude?.use("db")}catch(e){db=null}
  try{assets=await window.claude?.use("assets")}catch(e){assets=null}
  try{downloads=await window.claude?.use("downloads")}catch(e){downloads=null}
  // Fora do Claude (GitHub Pages) não existe "downloads": o PDF é salvo direto pelo jsPDF, então o botão continua visível
  if(db){
    db.collection("products").orderBy("name","asc").onSnapshot(s=>{
      products=s.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));render();
    },()=>fallbackToLocal());
    db.collection("movements").orderBy("date","desc").limit(100).onSnapshot(s=>{
      movements=s.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));render();
    },()=>{});
    // Load settings from db
    db.collection("settings").doc("store").onSnapshot(s=>{
      if(s.exists){
        const d=s.data();
        if(d.whatsapp)whatsappNumber=d.whatsapp;
        if(d.name)storeName=d.name;
      }
    },()=>{});
  }else{fallbackToLocal()}
  document.getElementById("search").addEventListener("input",render);
}

function fallbackToLocal(){
  db=null;
  try{products=JSON.parse(localStorage.getItem("cat_products")||"[]");movements=JSON.parse(localStorage.getItem("cat_movements")||"[]")}catch(e){products=[];movements=[]}
  render();
}
function saveLocal(){try{localStorage.setItem("cat_products",JSON.stringify(products));localStorage.setItem("cat_movements",JSON.stringify(movements))}catch(e){}}

async function uploadPhoto(file){if(!assets||!file)return null;try{const r=await assets.upload(file);return r.id}catch(e){return null}}
function photoUrl(id){return id?"/_blob/"+id:null}
// Reduz a foto no próprio navegador (máx. 600px, JPEG) antes de guardar: fora do Claude as fotos ficam
// no armazenamento do navegador (~5 MB no total) e uma foto de celular original estoura esse limite sozinha
function fileToDataUri(f){return new Promise(r=>{const rd=new FileReader();rd.onerror=()=>r(null);rd.onload=()=>{
  const img=new Image();img.onerror=()=>r(rd.result);img.onload=()=>{
    const MAX=600,esc=Math.min(1,MAX/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*esc);c.height=Math.round(img.height*esc);
    const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);
    r(c.toDataURL("image/jpeg",0.7));};img.src=rd.result;};rd.readAsDataURL(f)})}

// CRUD
async function addProduct(data,photoFile){
  const id=genId();
  let photoId=null;
  if(photoFile&&assets)photoId=await uploadPhoto(photoFile);
  else if(photoFile&&!assets)photoId=await fileToDataUri(photoFile);
  const p={name:data.name,category:data.category||"",stock:parseInt(data.stock)||0,price:parseFloat(data.price)||0,photoId:photoId||"",createdAt:new Date().toISOString()};
  if(db)await db.collection("products").doc(id).set(p);
  else{products.push({id,...p});saveLocal();render()}
}

async function updateProduct(id,data,photoFile){
  let photoId=data.photoId||"";
  if(photoFile&&assets){const n=await uploadPhoto(photoFile);if(n)photoId=n}
  else if(photoFile&&!assets)photoId=await fileToDataUri(photoFile);
  const u={...data,photoId};delete u.id;
  if(db)await db.collection("products").doc(id).set(u);
  else{const i=products.findIndex(p=>p.id===id);if(i>=0)products[i]={id,...u};saveLocal();render()}
}

async function deleteProduct(id){
  if(db)await db.collection("products").doc(id).delete();
  else{products=products.filter(p=>p.id!==id);movements=movements.filter(m=>m.productId!==id);saveLocal();render()}
}

async function addMovement(pid,type,qty,note){
  const p=products.find(x=>x.id===pid);if(!p)return;
  const ns=type==="entrada"?p.stock+qty:Math.max(0,p.stock-qty);
  const m={productId:pid,productName:p.name,type,qty,note:note||"",date:new Date().toISOString(),stockBefore:p.stock,stockAfter:ns};
  if(db){await db.collection("movements").doc(genId()).set(m);await db.collection("products").doc(pid).update({stock:ns})}
  else{movements.unshift({id:genId(),...m});p.stock=ns;saveLocal();render()}
}

// Render
function render(){
  const q=(document.getElementById("search").value||"").toLowerCase();
  const f=products.filter(p=>!q||p.name.toLowerCase().includes(q)||(p.category||"").toLowerCase().includes(q));
  document.getElementById("stat-total").textContent=products.length;
  document.getElementById("stat-stock").textContent=products.reduce((s,p)=>s+(p.stock||0),0);
  document.getElementById("stat-low").textContent=products.filter(p=>(p.stock||0)<=LOW&&(p.stock||0)>0).length;

  const el=document.getElementById("tab-products");
  if(!f.length){
    el.innerHTML='<div class="empty"><div class="empty-icon">&#128230;</div><div class="empty-text">'+(products.length===0?'Nenhum produto cadastrado.<br>Toque em <b>+ Novo</b> para começar.':'Nenhum produto encontrado.')+'</div></div>';
  }else{
    el.innerHTML=f.map(p=>{
      const cls=p.stock<=0?"stock-out":p.stock<=LOW?"stock-low":"stock-ok";
      const lbl=p.stock<=0?"Esgotado":p.stock+" un.";
      const src=p.photoId?(p.photoId.startsWith("data:")?p.photoId:photoUrl(p.photoId)):null;
      const th=src?'<img class="product-thumb" src="'+at(src)+'" alt="">':'<div class="product-thumb-placeholder">&#128247;</div>';
      return '<div class="product-card" onclick="openProductModal(\''+p.id+'\')">'+th+'<div class="product-info"><div class="product-name">'+es(p.name)+'</div>'+(p.category?'<div class="product-cat">'+es(p.category)+'</div>':'')+(p.price?'<div class="product-price">R$ '+p.price.toFixed(2)+'</div>':'')+'</div><div class="product-stock '+cls+'">'+lbl+'</div></div>';
    }).join("");
  }

  const h=document.getElementById("tab-history");
  if(!movements.length){h.innerHTML='<div class="empty"><div class="empty-icon">&#128203;</div><div class="empty-text">Nenhuma movimentação registrada.</div></div>'}
  else{h.innerHTML=movements.map(m=>{const isIn=m.type==="entrada";return '<div class="history-item"><div class="history-badge '+(isIn?"badge-in":"badge-out")+'">'+(isIn?"+":"-")+m.qty+'</div><div class="history-info"><div class="history-product">'+es(m.productName)+'</div><div class="history-date">'+fmtDate(m.date)+' &middot; '+m.stockBefore+' &rarr; '+m.stockAfter+' un.</div>'+(m.note?'<div class="history-note">'+es(m.note)+'</div>':'')+'</div></div>'}).join("")}
}

window.switchTab=function(t,b){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById("tab-products").style.display=t==="products"?"":"none";document.getElementById("tab-history").style.display=t==="history"?"":"none"};

// Modals
function showModal(h){const r=document.getElementById("modal-root");r.innerHTML='<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">'+h+'</div></div>';r.hidden=false}
window.closeModal=function(){const r=document.getElementById("modal-root");r.hidden=true;r.innerHTML=""};

  showModal('<h2>Novo Produto <button class="modal-close" onclick="closeModal()">&times;</button></h2><form id="add-form" onsubmit="handleAdd(event)"><div class="form-group"><label class="form-label">Foto do produto</label><div class="photo-upload-area" id="photo-area-add" onclick="document.getElementById(\'f-photo\').click()"><input type="file" id="f-photo" accept="image/*" onchange="previewPhoto(this,\'photo-area-add\')"><div class="photo-upload-icon">&#128247;</div><div class="photo-upload-label">Toque para adicionar foto</div></div></div><div class="form-group"><label class="form-label" for="f-name">Nome do produto</label><input class="form-input" id="f-name" required autocomplete="off"></div><div class="form-row"><div class="form-group"><label class="form-label" for="f-cat">Categoria</label><input class="form-input" id="f-cat" autocomplete="off"></div><div class="form-group"><label class="form-label" for="f-price">Preço (R$)</label><input class="form-input" id="f-price" type="number" step="0.01" min="0" inputmode="decimal"></div></div><div class="form-group"><label class="form-label" for="f-stock">Estoque inicial</label><input class="form-input" id="f-stock" type="number" min="0" inputmode="numeric" value="0"></div><button class="btn btn-primary" style="width:100%;margin-top:6px">Cadastrar produto</button></form>');
};

window.previewPhoto=function(input,areaId){
  const file=input.files&&input.files[0];if(!file)return;
  const area=document.getElementById(areaId);const reader=new FileReader();
  reader.onload=function(e){area.innerHTML='<input type="file" id="'+input.id+'" accept="image/*" onchange="previewPhoto(this,\''+areaId+'\')" style="display:none"><img src="'+e.target.result+'" alt="Preview"><div class="photo-upload-label" style="margin-top:6px">Toque para trocar</div>';const ni=document.getElementById(input.id);const dt=new DataTransfer();dt.items.add(file);ni.files=dt.files};
  reader.readAsDataURL(file);
};

window.handleAdd=async function(e){
  e.preventDefault();const pi=document.getElementById("f-photo");const file=pi&&pi.files&&pi.files[0];
  await addProduct({name:document.getElementById("f-name").value.trim(),category:document.getElementById("f-cat").value.trim(),price:document.getElementById("f-price").value,stock:document.getElementById("f-stock").value},file||null);
  closeModal();
};

// PDF
async function loadImgB64(src){try{const r=await fetch(src);const b=await r.blob();return new Promise(res=>{const rd=new FileReader();rd.onload=()=>res(rd.result);rd.onerror=()=>res(null);rd.readAsDataURL(b)})}catch(e){return null}}

window.generatePDF=async function(){
  if(!products.length)return;
  const btn=document.getElementById("pdf-btn");btn.classList.add("pdf-generating");btn.textContent="...";
  try{
    const{jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
    const pw=210,ph=297,m=12,uw=pw-m*2;
    const now=new Date();
    const ds=now.toLocaleDateString("pt-BR")+" "+now.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    const sorted=[...products].sort((a,b)=>(a.name||"").localeCompare(b.name||""));

    // Preload images
    const ic={};
    for(const p of sorted){if(p.photoId){const s=p.photoId.startsWith("data:")?p.photoId:photoUrl(p.photoId);if(s)ic[p.id]=await loadImgB64(s)}}

    // Brand colors from logo
    const brandColors=[[76,175,80],[21,101,192],[249,168,37],[229,57,53],[236,64,122]];
    const cols=2,gap=6,colW=(uw-gap)/cols,itemH=64,imgS=36,headerH=40;

    function drawHeader(pg){
      // Gradient-like header with brand colors
      const bh=30;
      doc.setFillColor(21,101,192);
      doc.rect(0,0,pw,bh,"F");
      // Color accent bar
      const bw=pw/5;
      brandColors.forEach((c,i)=>{doc.setFillColor(c[0],c[1],c[2]);doc.rect(bw*i,bh,bw,3,"F")});

      // Logo
      try{doc.addImage(LOGO_B64,"JPEG",m,4,40,22,undefined,"FAST")}catch(e){}

      // Title
      doc.setFontSize(16);doc.setFont("helvetica","bold");doc.setTextColor(255);
      doc.text(storeName.toUpperCase(),m+44,14);
      doc.setFontSize(9);doc.setFont("helvetica","normal");
      doc.text("CATÁLOGO DE PRODUTOS",m+44,20);
      doc.setFontSize(8);
      doc.text(ds,pw-m,14,{align:"right"});
      doc.text("Pág. "+pg,pw-m,20,{align:"right"});
      doc.setTextColor(0);
    }

    function drawFooter(pg,tp){
      // Color bar at bottom
      const bw=pw/5,by=ph-8;
      brandColors.forEach((c,i)=>{doc.setFillColor(c[0],c[1],c[2]);doc.rect(bw*i,by,bw,8,"F")});
      doc.setFontSize(7);doc.setTextColor(255);
      const waDisp=whatsappNumber?("WhatsApp: "+whatsappNumber):"";
      doc.text(storeName+(waDisp?" | ":"")+waDisp,pw/2,ph-3.5,{align:"center"});
      // General order link in footer
      if(waNum){
        const genMsg=encodeURIComponent("Olá! Vi o catálogo da "+storeName+" e gostaria de fazer um pedido.");
        const genUrl="https://wa.me/"+waNum+"?text="+genMsg;
        doc.setFontSize(8);doc.setFont("helvetica","bold");
        const fTxt="Clique aqui para fazer seu pedido";
        const fW=doc.getTextWidth(fTxt);
        doc.textWithLink(fTxt,(pw-fW)/2,ph-0.8,{url:genUrl});
      }
      doc.setTextColor(0);
    }

    const waNum=whatsappNumber?whatsappNumber.replace(/\D/g,''):'';
    let idx=0,pageNum=1;
    drawHeader(pageNum);

    while(idx<sorted.length){
      const startY=headerH;const endY=ph-12;const rows=Math.floor((endY-startY)/itemH);
      for(let row=0;row<rows&&idx<sorted.length;row++){
        for(let col=0;col<cols&&idx<sorted.length;col++){
          const p=sorted[idx];const num=idx+1;
          const x=m+col*(colW+gap);const y=startY+row*itemH;

          // Card bg
          doc.setFillColor(250,250,250);doc.setDrawColor(220);
          doc.roundedRect(x,y,colW,itemH-3,3,3,"FD");

          // Number badge with brand color
          const bc=brandColors[num%brandColors.length];
          doc.setFillColor(bc[0],bc[1],bc[2]);
          doc.roundedRect(x+2,y+2,10,10,2,2,"F");
          doc.setFontSize(8);doc.setFont("helvetica","bold");doc.setTextColor(255);
          doc.text(String(num).padStart(2,"0"),x+7,y+9,{align:"center"});
          doc.setTextColor(0);

          // Photo
          const imgD=ic[p.id];const imgX=x+14;const imgY=y+3;
          if(imgD){try{doc.addImage(imgD,"JPEG",imgX,imgY,imgS,imgS,undefined,"FAST")}catch(e){doc.setFillColor(235);doc.rect(imgX,imgY,imgS,imgS,"F");doc.setFontSize(7);doc.setTextColor(160);doc.text("Sem foto",imgX+imgS/2,imgY+imgS/2+1,{align:"center"});doc.setTextColor(0)}}
          else{doc.setFillColor(235);doc.rect(imgX,imgY,imgS,imgS,"F");doc.setFontSize(7);doc.setTextColor(160);doc.text("Sem foto",imgX+imgS/2,imgY+imgS/2+1,{align:"center"});doc.setTextColor(0)}

          // Name
          const nameX=x+14;const nameY=imgY+imgS+4;
          doc.setFontSize(8);doc.setFont("helvetica","bold");doc.setTextColor(40);
          const nl=doc.splitTextToSize(p.name||"",colW-16);
          doc.text(nl.slice(0,2),nameX,nameY);

          // Price
          if(p.price){
            doc.setFontSize(10);doc.setFont("helvetica","bold");
            doc.setTextColor(bc[0],bc[1],bc[2]);
            doc.text("R$ "+p.price.toFixed(2),x+colW-4,y+12,{align:"right"});
            doc.setTextColor(0);
          }

          // WhatsApp order link per product
          if(waNum&&p.price>0){
            const orderMsg=encodeURIComponent("Olá! Gostaria de pedir:\n*"+p.name+"*\nPreço: R$ "+p.price.toFixed(2)+"\n\nAguardo confirmação!");
            const orderUrl="https://wa.me/"+waNum+"?text="+orderMsg;
            doc.setFontSize(7);doc.setFont("helvetica","bold");
            doc.setTextColor(37,211,102);
            const linkTxt="Pedir via WhatsApp";
            const linkX=x+colW-4;const linkY=y+itemH-7;
            doc.textWithLink(linkTxt,linkX-doc.getTextWidth(linkTxt),linkY,{url:orderUrl});
            // underline
            const tw2=doc.getTextWidth(linkTxt);
            doc.setDrawColor(37,211,102);doc.setLineWidth(0.3);
            doc.line(linkX-tw2,linkY+0.5,linkX,linkY+0.5);
            doc.setTextColor(0);doc.setDrawColor(220);
          }
          idx++;
        }
      }
      drawFooter(pageNum,1);
      if(idx<sorted.length){doc.addPage();pageNum++;drawHeader(pageNum)}
    }

    const nomeArq="catalogo-"+storeName.toLowerCase().replace(/\s+/g,"-")+".pdf";
    if(downloads){const blob=doc.output("blob");try{await downloads.save({filename:nomeArq,data:blob})}catch(e){}}
    else doc.save(nomeArq);
  }catch(e){console.error("PDF:",e)}
  finally{btn.classList.remove("pdf-generating");btn.textContent="\u{1F4C4}"}
};

function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function es(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function at(s){return(s||"").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function fmtDate(iso){try{const d=new Date(iso);return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}catch(e){return iso}}

init();
})();

// ===== INSTALAÇÃO (PWA) =====
// O botão não depende só do banner automático do navegador, porque ele
// não existe no iPhone e às vezes não aparece no Android.
let eventoInstalacao = null;
const btnInstalar = document.getElementById('btn-instalar');
// iPad recente se identifica como Mac, por isso o teste de toque
const ehIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function appJaInstalado() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
if (appJaInstalado()) btnInstalar.hidden = true;
// Guarda o evento para disparar a instalação quando o usuário clicar no botão
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); eventoInstalacao = e; });
async function instalarApp() {
  if (eventoInstalacao) {
    eventoInstalacao.prompt();
    const { outcome } = await eventoInstalacao.userChoice;
    eventoInstalacao = null; // o evento só pode ser usado uma vez
    if (outcome === 'accepted') btnInstalar.hidden = true;
    return;
  }
  // Sem instalação automática: mostra o passo a passo manual
  const passos = ehIOS
    ? ['Abra este app no <b>Safari</b>.',
       'Toque no botão <b>Compartilhar</b> (quadrado com seta para cima).',
       'Escolha <b>Adicionar à Tela de Início</b>.',
       'Toque em <b>Adicionar</b>.']
    : ['Toque no menu do navegador (<b>⋮</b>), no canto superior.',
       'Escolha <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.',
       'Confirme em <b>Instalar</b>.'];
  document.getElementById('passos-instalar').innerHTML = passos.map(p => '<li>' + p + '</li>').join('');
  document.getElementById('modal-instalar').hidden = false;
}
function fecharModalInstalar() { document.getElementById('modal-instalar').hidden = true; }
window.addEventListener('appinstalled', () => { btnInstalar.hidden = true; });
// Service worker: necessário para o navegador considerar o app instalável
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
</script>
